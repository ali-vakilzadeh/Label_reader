[project]
name = "label-ledger"
version = "1.0.0"
description = "A mobile warehouse app for photographing labels, reviewing AI-extracted inventory data, and saving records locally or to Google Sheets."
requires-python = ">=3.12"
authors = [
    { name = "Ali Vakilzadeh", email = "ali.vakilzadeh@gmail.com" }
]
dependencies = [
    "flet[all]",
    "flet-camera",
    "google-genai",
    "google-api-python-client",
    "google-auth",
]

[dependency-groups]
dev = [
    "flet-cli",
    "flet-desktop",
    "flet-web"
]

[tool.flet.metadata]
title = "Label Ledger"

[tool.flet]
org = "dev.flet"
company = "Ali Vakilzadeh"
copyright = "Copyright (C) 2026 by Ali Vakilzadeh"
persmissions = ["camera"]