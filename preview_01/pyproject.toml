[project]
name = "label-ledger"
version = "1.0.0"
description = "A mobile warehouse app for photographing labels, reviewing AI-extracted inventory data, and saving records locally or to Google Sheets."
requires-python = ">=3.12"
authors = [
    { name = "Ali Vakilzadeh", email = "ali.vakilzadeh@gmail.com" }
]
dependencies = [
    "flet==0.86.5",
    "flet-camera==0.86.5",
    "google-genai==2.17.0",
    "google-api-python-client==2.198.0",
    "google-auth==2.56.3",
]

[dependency-groups]
dev = [
    "flet-cli",
    "flet-desktop",
    "flet-web"
]

[tool.flet.android]
target_arch = ["arm64-v8a"]
min_sdk_version = 26

[tool.flet.metadata]
title = "Label Ledger"

[tool.flet]
org = "dev.flet"
company = "Ali Vakilzadeh"
copyright = "Copyright (C) 2026 by Ali Vakilzadeh"
persmissions = ["camera"]